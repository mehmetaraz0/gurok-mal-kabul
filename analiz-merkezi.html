<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script src="auth-guard.js"></script>
<script src="supabase-config.js"></script>
<script src="otel-config.js"></script>
<script src="nav-drawer.js"></script>
<script src="ortak.js"></script>
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Araz — Akıllı Analiz</title>
<meta name="theme-color" content="#1a2744">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-100)}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--primary);color:white;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:56px;box-shadow:var(--shadow)}
.header h1{font-size:15px;font-weight:700;flex:1}
.header .sub{font-size:11px;opacity:.7;display:block;margin-top:1px}
.hbtn{background:rgba(255,255,255,.15);border:none;color:white;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hbtn:active{background:rgba(255,255,255,.3)}
.sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.card{background:white;border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* günlük özet */
.ozet-grid{display:flex;gap:10px;flex-wrap:wrap}
.ozet-otel{flex:1;min-width:140px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);padding:10px}
.ozet-otel h3{font-size:12px;color:var(--primary);margin-bottom:8px}
.ozet-satir{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 0;color:var(--gray-700)}
.ozet-say{font-weight:700;font-size:15px;color:var(--primary)}
.ozet-say.uyari{color:#e67e22}.ozet-say.kritik{color:#c0392b}
/* soru */
.soru-satir{display:flex;gap:8px}
.soru-satir input{flex:1;padding:11px 12px;border:1.5px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;outline:none}
.soru-satir input:focus{border-color:var(--primary)}
.sor-btn{background:var(--primary);color:white;border:none;border-radius:var(--radius-sm);padding:0 18px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
.sor-btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--gray-100);border:1px solid var(--gray-300);border-radius:14px;padding:6px 11px;font-size:12px;color:var(--gray-700);cursor:pointer}
.chip:active{background:var(--gray-200)}
/* cevap */
.rozet{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:#eaf2ff;color:#2d6cdf;margin-bottom:8px}
.ozet-metin{font-size:13px;line-height:1.55;color:var(--gray-800);white-space:pre-wrap}
.not-uyari{background:#fff6e5;border:1px solid #f0c674;color:#8a6d1a;font-size:12px;border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:10px}
.hata-kutu{background:#fdecec;border:1px solid #e8a3a3;color:#a02020;font-size:13px;border-radius:var(--radius-sm);padding:11px}
.meta{font-size:11px;color:var(--gray-500);margin-top:6px}
.kaynak-baslik{font-size:12px;font-weight:600;color:var(--gray-600);margin:12px 0 6px}
table.dt{width:100%;border-collapse:collapse;font-size:11.5px}
table.dt th{background:var(--gray-100);color:var(--gray-600);font-weight:600;text-align:left;padding:6px 8px;position:sticky;top:0}
table.dt td{padding:6px 8px;border-top:1px solid var(--gray-200);color:var(--gray-800);white-space:nowrap}
.es{text-align:center;padding:24px;color:var(--gray-400)}.ei{font-size:32px;margin-bottom:6px}.et{font-size:13px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin-min{width:22px;height:22px;border:2.5px solid var(--gray-300);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app" style="display:none">
  <div class="header">
    <button class="hbtn" onclick="location.href='index.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1Z"/></svg></button>
    <div style="flex:1"><h1>Akıllı Analiz Merkezi</h1><span class="sub" id="hsub"></span></div>
  </div>

  <div class="sc">
    <!-- Günlük özet -->
    <div class="card">
      <div class="card-title">📊 Günlük Özet</div>
      <div id="ozet-kutu"><div class="spin-min"></div></div>
    </div>

    <!-- Soru sor -->
    <div class="card">
      <div class="card-title">💬 Soru Sor</div>
      <div class="soru-satir">
        <input id="soru" type="text" placeholder="Örn: yaklaşan son kullanma tarihleri" autocomplete="off">
        <button class="sor-btn" id="sorBtn" onclick="sor()">Sor</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <!-- Cevap -->
    <div id="cevap"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// SB_URL/SB_KEY/SB_HEADERS -> supabase-config.js · escapeHtml/sLD/hLD -> ortak.js
// OTEL_ISIMLERI/OTEL_KISA -> otel-config.js · oturumAccessTokenGetir -> auth-guard.js

let CU = null;
let mesgul = false;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),3000);}

const ORNEK_SORULAR = [
  'Yaklaşan son kullanma tarihleri',
  'Minimum altı stoklar',
  'Stok anomalileri (olağandışı hareketler)',
  'Yavaş dönen ürünler',
  'Tüketimi en çok artan ürünler',
  'Günlük özet'
];

// Kolon adı -> Türkçe başlık
const BASLIK = {
  otel_id:'Otel', depo_kodu:'Depo', urun_kodu:'Ürün Kodu', urun_adi:'Ürün',
  miktar:'Miktar', skt_tarihi:'SKT', kalan_gun:'Kalan Gün', tip:'Tip', tarih:'Tarih',
  ort_30:'Ortalama', sapma_30:'Sapma', min_miktar:'Min', eksik_miktar:'Eksik',
  son_donem:'Son Dönem', onceki_donem:'Önceki Dönem',
  bekleyen_mal_kabul:'Bekleyen', kritik_skt_14gun:'Kritik SKT', min_alti_urun:'Min Altı'
};
function baslikTr(k){ return BASLIK[k] || k; }
function hucreBicim(k, v){
  if(v === null || v === undefined) return '—';
  if(k === 'otel_id') return (OTEL_KISA[String(v)] || v);
  if(typeof v === 'number') return (Math.round(v*100)/100).toString();
  return String(v);
}

function tabloYap(arr){
  if(!Array.isArray(arr) || !arr.length) return '<div class="es"><div class="ei">📭</div><div class="et">Bu sorgu için veri bulunamadı.</div></div>';
  const kolonlar = Object.keys(arr[0]);
  let h = '<div style="overflow-x:auto"><table class="dt"><thead><tr>' +
    kolonlar.map(k=>`<th>${escapeHtml(baslikTr(k))}</th>`).join('') + '</tr></thead><tbody>';
  arr.forEach(r=>{
    h += '<tr>' + kolonlar.map(k=>`<td>${escapeHtml(hucreBicim(k, r[k]))}</td>`).join('') + '</tr>';
  });
  return h + '</tbody></table></div>';
}

// --- Günlük özet kartı (RPC doğrudan, AI'sız — anlık) ---
async function gunlukOzetYukle(){
  const kutu = document.getElementById('ozet-kutu');
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/ai_q_gunluk_ozet', {
      method:'POST', headers: SB_HEADERS, body: JSON.stringify({})
    });
    if(!r.ok) throw new Error('rpc ' + r.status);
    const rows = await r.json(); // [{otel_id,bekleyen_mal_kabul,kritik_skt_14gun,min_alti_urun}]
    if(!Array.isArray(rows) || !rows.length){ kutu.innerHTML = '<div class="es"><div class="et">Özet verisi yok.</div></div>'; return; }
    kutu.innerHTML = '<div class="ozet-grid">' + rows.map(o=>`
      <div class="ozet-otel">
        <h3>${escapeHtml(OTEL_ISIMLERI[String(o.otel_id)] || o.otel_id)}</h3>
        <div class="ozet-satir"><span>Bekleyen mal kabul</span><span class="ozet-say">${o.bekleyen_mal_kabul||0}</span></div>
        <div class="ozet-satir"><span>14 günde kritik SKT</span><span class="ozet-say ${(o.kritik_skt_14gun>0)?'uyari':''}">${o.kritik_skt_14gun||0}</span></div>
        <div class="ozet-satir"><span>Minimum altı ürün</span><span class="ozet-say ${(o.min_alti_urun>0)?'kritik':''}">${o.min_alti_urun||0}</span></div>
      </div>`).join('') + '</div>';
  }catch(e){
    kutu.innerHTML = '<div class="es"><div class="et">Özet yüklenemedi.</div></div>';
  }
}

// --- Soru sor (Edge Function -> Groq) ---
function soruAyarla(s){ document.getElementById('soru').value = s; sor(); }

async function sor(){
  if(mesgul) return;
  const inp = document.getElementById('soru');
  const soru = (inp.value || '').trim();
  if(!soru){ toast('Bir soru yaz'); inp.focus(); return; }

  mesgul = true;
  document.getElementById('sorBtn').disabled = true;
  const cevap = document.getElementById('cevap');
  cevap.innerHTML = '<div class="card"><div class="spin-min"></div><div style="text-align:center;font-size:12px;color:var(--gray-500)">Analiz ediliyor…</div></div>';

  try{
    const jwt = oturumAccessTokenGetir();
    const r = await fetch(SB_URL + '/functions/v1/ai-analiz-sorgula', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ soru, jwt })
    });
    const j = await r.json();
    cevabiCiz(soru, j);
  }catch(e){
    cevap.innerHTML = '<div class="card"><div class="hata-kutu">Bağlantı hatası — lütfen tekrar dene.</div></div>';
  }finally{
    mesgul = false;
    document.getElementById('sorBtn').disabled = false;
  }
}

function cevabiCiz(soru, j){
  const cevap = document.getElementById('cevap');
  if(!j || j.ok !== true){
    const msg = (j && j.mesaj) ? j.mesaj : 'Beklenmeyen bir hata oluştu.';
    cevap.innerHTML = `<div class="card"><div class="hata-kutu">${escapeHtml(msg)}</div></div>`;
    return;
  }
  if(j.yanitlanamadi){
    cevap.innerHTML = `<div class="card"><div class="not-uyari">${escapeHtml(j.mesaj || 'Bu soruyu şu an yanıtlayamıyorum.')}</div></div>`;
    return;
  }

  const arr = Array.isArray(j.kaynak) ? j.kaynak : [];
  let h = '<div class="card">';
  h += `<div style="font-size:12px;color:var(--gray-500);margin-bottom:8px">❓ ${escapeHtml(soru)}</div>`;
  if(j.not) h += `<div class="not-uyari">⚠️ ${escapeHtml(j.not)}</div>`;
  h += '<div class="rozet">AI YORUMU</div>';
  h += `<div class="ozet-metin">${escapeHtml(j.ozet || '')}</div>`;
  h += `<div class="kaynak-baslik">📋 Kaynak veri (${j.satir_sayisi||arr.length} satır — doğrulanabilir)</div>`;
  h += tabloYap(arr);
  h += `<div class="meta">niyet: ${escapeHtml(j.intent||'')} · ${escapeHtml(JSON.stringify(j.parametreler||{}))}</div>`;
  h += '</div>';
  cevap.innerHTML = h;
}

// --- Başlangıç ---
function chipleriCiz(){
  document.getElementById('chips').innerHTML = ORNEK_SORULAR
    .map(s=>`<button class="chip" onclick="soruAyarla('${s.replace(/'/g,"\\'")}')">${escapeHtml(s)}</button>`).join('');
}

function yetkisizGoster(){
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f3f5;font-family:-apple-system,'Segoe UI',sans-serif;padding:20px">
      <div style="background:white;border-radius:16px;padding:32px 28px;max-width:340px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.15)">
        <div style="font-size:40px;margin-bottom:12px">🔒</div>
        <div style="font-weight:700;color:#1a2744;margin-bottom:8px">Bu modül sana kapalı</div>
        <div style="font-size:13px;color:#6c757d;margin-bottom:20px">Akıllı Analiz Merkezi için yetkin bulunmuyor.</div>
        <a href="index.html" style="display:inline-block;background:#1a2744;color:white;padding:10px 20px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600">Portala Dön</a>
      </div>
    </div>`;
}

(async function(){
  CU = requireLogin();
  if(!CU) return;
  // Yetki: modül bazlı (yetki_matrisi.ai_analiz_merkezi). EF de ayrıca doğruluyor.
  const yetkiler = await kullaniciYetkileriGetir();
  if(!yetkiler['ai_analiz_merkezi']){ yetkisizGoster(); return; }

  document.getElementById('app').style.display = 'flex';
  document.getElementById('hsub').textContent = (CU.rol||'') + ' ' + (CU.ad||'');
  chipleriCiz();
  document.getElementById('soru').addEventListener('keydown', e=>{ if(e.key==='Enter') sor(); });
  gunlukOzetYukle();
})();
</script>
</body>
</html>
