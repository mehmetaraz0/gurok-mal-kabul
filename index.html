<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon.png">
<script src="auth-guard.js"></script>
<script src="supabase-config.js"></script>
<script src="otel-config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dornevi — Depo Yönetim Sistemi</title>
<meta name="theme-color" content="#15213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root {
  --primary: #15213a;
  --primary-light: #2d4080;
  --accent: #c9a24b;
  --success: #27ae60;
  --warning: #c8862c;
  --danger: #b5442a;
  --gray-50: #f8f9fa;
  --gray-100: #f1f3f5;
  --gray-200: #e4e7ec;
  --gray-300: #dee2e6;
  --gray-400: #ced4da;
  --gray-500: #8992a3;
  --gray-600: #5b6472;
  --gray-700: #495057;
  --white: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-100); color: var(--primary); }

/* ===== LOGIN ===== */
#screen-login {
  min-height: 100vh;
  background: linear-gradient(160deg, var(--primary) 0%, var(--primary-light) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#screen-login.hidden { display: none; }

.login-box {
  background: white;
  border-radius: 12px;
  padding: 32px 28px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.25);
}
.login-logo {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo .logo-icon {
  width: 64px; height: 64px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
  font: 700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color: var(--primary); letter-spacing: .3px;
}
.login-logo h1 { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -.01em; }
.login-logo p { font-size: 12.5px; color: var(--gray-500); margin-top: 4px; }

.pin-label { text-align: center; font-size: 13px; color: var(--gray-600); margin-bottom: 6px; }
.pin-user-show { text-align: center; font-weight: 700; color: var(--primary); font-size: 15px; min-height: 22px; margin-bottom: 10px; }
.pin-display { display: flex; justify-content: center; gap: 12px; margin-bottom: 8px; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gray-400); transition: all 0.15s; }
.pin-dot.filled { background: var(--primary); border-color: var(--primary); transform: scale(1.1); }
.pin-error { text-align: center; font-size: 12px; color: var(--danger); min-height: 18px; margin-bottom: 8px; }
.pin-pad { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 4px; }
.pin-btn {
  height: 56px; border: none; border-radius: 8px;
  font-size: 20px; font-weight: 600; cursor: pointer;
  background: var(--gray-100); color: var(--primary);
  transition: all 0.1s;
}
.pin-btn:active { background: var(--gray-300); transform: scale(0.95); }
.pin-btn.empty { background: transparent; cursor: default; }
.pin-btn.del { font-size: 16px; }
.btn-ms{width:100%;margin-top:14px;padding:12px;border:1.5px solid var(--primary);border-radius:8px;background:white;color:var(--primary);font-size:14px;font-weight:600;cursor:pointer}
.btn-ms:active{background:var(--gray-100)}

/* ===== PORTAL SHELL ===== */
#screen-portal { display: none; min-height: 100vh; }
#screen-portal.active { display: flex; }

/* Sidebar (desktop, >=900px) — açılır/kapanır, varsayılan kapalı */
.sidebar {
  width: 236px; flex: none; background: var(--primary);
  display: flex; flex-direction: column; padding: 0 0 20px;
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 401;
  transform: translateX(-100%); transition: transform .22s ease;
  box-shadow: 2px 0 24px rgba(0,0,0,.35);
}
.sidebar.open { transform: translateX(0); }
@media (max-width: 899px) { .sidebar { display: none; } }

.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 400; }
.sidebar-overlay.open { display: block; }

.sidebar-toggle-btn {
  background: var(--gray-100); border: none; color: var(--primary);
  width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex: none; margin-right: 14px;
}
.sidebar-toggle-btn:hover { background: var(--gray-200); }
@media (max-width: 899px) { .sidebar-toggle-btn { display: none; } }

.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 24px 22px 20px; border-bottom: 1px solid rgba(255,255,255,.08);
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 7px;
  border: 1px solid rgba(255,255,255,.3);
  display: flex; align-items: center; justify-content: center;
  font: 700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color: #fff; flex: none;
}
.brand-mark.small { width: 26px; height: 26px; font-size: 12px; border-radius: 6px; }
.brand-name { font-size: 13.5px; font-weight: 700; color: #fff; letter-spacing: .4px; }
.brand-sub { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.45); margin-top: 2px; letter-spacing: .3px; text-transform: uppercase; }

.sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sidebar-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 6px;
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.72);
  text-decoration: none; cursor: pointer; border-left: 2px solid transparent;
}
.sidebar-item svg { width: 15px; height: 15px; flex: none; opacity: .85; }
.sidebar-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.sidebar-item.active { background: rgba(255,255,255,.08); color: #fff; border-left-color: var(--accent); }
.sidebar-item.disabled { opacity: .45; cursor: default; pointer-events: none; }
.sidebar-footer { padding: 14px 22px 0; font-size: 10.5px; color: rgba(255,255,255,.35); }

/* Main column */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--gray-100); }

.topbar {
  height: 60px; flex: none; background: #fff; border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
}
@media (max-width: 899px) { .topbar { background: var(--primary); border-bottom: none; padding: 0 16px; height: 56px; } }

.topbar-brand { display: none; align-items: center; gap: 9px; }
@media (max-width: 899px) { .topbar-brand { display: flex; } }
.topbar-brand span { font: 700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color: #fff; letter-spacing: .3px; }

.crumb { font-size: 13px; color: var(--gray-600); }
.crumb b { color: var(--primary); font-weight: 600; }
@media (max-width: 899px) { .crumb { display: none; } }

.topbar-user { display: flex; align-items: center; gap: 10px; }
.user-info { text-align: right; line-height: 1.25; }
.user-name { font-size: 12.5px; font-weight: 600; color: var(--primary); }
@media (max-width: 899px) { .user-name { color: #fff; } }
.user-rol { font-size: 10.5px; color: var(--gray-500); }
@media (max-width: 899px) { .user-rol { color: rgba(255,255,255,.6); } }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--primary);
  border: 1px solid var(--accent); color: #fff; flex: none;
  display: flex; align-items: center; justify-content: center;
  font: 600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.logout-btn {
  background: rgba(21,33,58,.08); border: none; color: var(--primary);
  width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex: none;
}
@media (max-width: 899px) { .logout-btn { background: rgba(255,255,255,.15); color: #fff; } }
.logout-btn:active { background: rgba(21,33,58,.18); }

.main-content { flex: 1; padding: 24px 26px 40px; max-width: 1200px; width: 100%; overflow-y: auto; }
@media (max-width: 899px) { .main-content { padding: 16px 16px 32px; } }

.tab-bar-app { display: flex; align-items: center; background: var(--primary); border-bottom: 1px solid rgba(255,255,255,.1); flex: none; }
.tab-bar-scroll { display: flex; align-items: center; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab-bar-scroll::-webkit-scrollbar { display: none; }
.tab-app-btn { display: flex; align-items: center; gap: 6px; padding: 0 14px; height: 38px; min-width: 120px; max-width: 200px; background: transparent; border: none; border-bottom: 2px solid transparent; color: rgba(255,255,255,.6); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; flex: none; font-family: inherit; }
.tab-app-btn.active { color: #fff; border-bottom-color: var(--accent); background: rgba(255,255,255,.05); }
.tab-app-btn .tab-label { overflow: hidden; text-overflow: ellipsis; }
.tab-app-btn .tab-close { flex: none; opacity: .6; border-radius: 4px; padding: 3px; display: flex; }
.tab-app-btn .tab-close:hover { opacity: 1; background: rgba(255,255,255,.15); }
.tab-app-add { flex: none; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: rgba(255,255,255,.6); cursor: pointer; }
.tab-app-add:hover { color: #fff; background: rgba(255,255,255,.08); }
.tab-app-content { flex: 1; position: relative; overflow: hidden; }
.tab-app-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; background: #fff; }
.tab-app-frame.active { display: block; }
#tab-panel-home { background: var(--gray-100); }

.welcome-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.welcome-row h2 { font-size: 19px; font-weight: 700; color: var(--primary); letter-spacing: -.01em; }
.welcome-row p { font-size: 12.5px; color: var(--gray-500); margin-top: 2px; }
.welcome-date { font-size: 12.5px; font-weight: 500; color: var(--gray-500); white-space: nowrap; }

/* KPI şeridi */
.kpi-strip { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 26px; }
@media (min-width: 560px) { .kpi-strip { grid-template-columns: repeat(4,1fr); } }
@media (max-width: 559px) { .kpi-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; } }
.kpi-card {
  background: #fff; border: 1px solid var(--gray-200); border-top: 2px solid var(--accent);
  border-radius: 6px; padding: 12px 14px;
}
@media (max-width: 559px) { .kpi-card { flex: none; min-width: 128px; } }
.kpi-label { font-size: 10.5px; font-weight: 500; color: var(--gray-500); text-transform: uppercase; letter-spacing: .4px; }
.kpi-num { font-size: 21px; font-weight: 800; color: var(--primary); margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi-num.warn { color: var(--danger); }

/* Modül grid */
.modules-title {
  font-size: 11px; font-weight: 600; color: var(--gray-500);
  text-transform: uppercase; letter-spacing: 0.6px;
  margin-bottom: 14px;
}

.modules-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
@media (min-width: 600px) { .modules-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .modules-grid { grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); } }

.module-card {
  background: white;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 18px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
  text-decoration: none;
  color: inherit;
  display: flex;
  gap: 13px;
  align-items: flex-start;
  position: relative;
}
.module-card.available:hover { border-color: var(--primary); transform: translateY(-1px); }
.module-card.coming-soon { background: var(--gray-50); border-style: dashed; opacity: 0.65; cursor: default; }

.module-icon {
  width: 38px; height: 38px; flex: none;
  border-radius: 7px; border: 1px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
}
.module-card.coming-soon .module-icon { border-color: var(--gray-500); color: var(--gray-500); }
.module-icon svg { width: 18px; height: 18px; }
.module-name { font-size: 13.5px; font-weight: 700; color: var(--primary); line-height: 1.3; }
.module-desc { font-size: 11.5px; color: var(--gray-500); line-height: 1.4; margin-top: 2px; }
.module-soon-tag {
  font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
  background: var(--gray-200); color: var(--gray-500);
  padding: 2px 7px; border-radius: 4px; margin-top: 6px; display: inline-block;
}

/* Loading */
#loading {
  display: none;
  position: fixed; inset: 0;
  background: rgba(21,33,58,0.85);
  z-index: 9999;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; color: white;
}
#loading.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--primary); color: white;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 500;
  z-index: 9998; opacity: 0;
  transition: all 0.3s; pointer-events: none;
  white-space: nowrap; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="screen-login">
  <div class="login-box">
    <div class="login-logo">
      <div class="logo-icon"><img src="icon-mark.svg" alt="Dornevi" style="width:70%;height:70%;object-fit:contain"></div>

<!-- ===== PORTAL ===== -->
<div id="screen-portal">

<script>
// ============================================================
// CONFIG
// ============================================================
// SB_URL/SB_KEY/SB_HEADERS -> supabase-config.js
// SESSION_KEY artık auth-guard.js'de tanımlı (paylaşılan) — burada tekrar tanımlanmıyor.

// Modül tanımları — ikon: 24x24 çizgi ikon path'i (stroke=currentColor)
const MODULLER = [
  {
    id: 'malkabul', ad: 'Mal Kabul', desc: 'Teslimat girişi, onay, SKT takip',
    url: 'mal-kabul-v2.html', moduller: ['mal_kabul_form','mal_kabul_kalite'], durum: 'aktif',
    svg: '<path d="M9 3h6v3H9z"/><rect x="4" y="6" width="16" height="15" rx="1"/><path d="M8 12h8M8 16h5"/>'
  },
  {
    id: 'stok', ad: 'Stok Takip', desc: 'Anlık stok, giriş/çıkış',
    url: 'stok-takip.html', moduller: ['stok_takip'], durum: 'aktif',
    svg: '<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>'
  },
  {
    id: 'depo-siparis', ad: 'Depo Siparişleri', desc: 'Mutfak & departman talepleri',
    url: 'depo-siparis.html', moduller: ['depo_siparis'], durum: 'aktif',
    svg: '<rect x="3" y="7" width="18" height="14" rx="1"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>'
  },
  {
    id: 'satinalma', ad: 'Satın Alma', desc: 'Sipariş takip, LN Infor',
    url: 'satin-alma.html', moduller: ['ic_talep','siparis_olustur','siparis_takip','fiyat_kontrol','tedarikci_skorkart','firma_yonetimi'], durum: 'aktif',
    svg: '<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.2 11.4a2 2 0 002 1.6h7.6a2 2 0 002-1.6L21 8H6"/>'
  },

const ROL_IKON = { yonetici:'👔', depo:'📦', satinalma:'🛒', kalite:'🔍', mutfak:'🍳', bar:'🍹', muhasebe_muduru:'💼', muhasebe_calisani:'💰', cost_control:'📐' };
const ROL_AD   = { yonetici:'Yönetici', depo:'Depo', satinalma:'Satınalma', kalite:'Kalite', mutfak:'Mutfak', bar:'Bar', muhasebe_muduru:'Muhasebe Müdürü', muhasebe_calisani:'Muhasebe', cost_control:'Cost Control' };

let GORUNUR_MODULLER = [];
let users = [];
let currentUser = null;

async function loadUsers() {
  try {
    const r = await fetch(SB_URL + '/rest/v1/kullanicilar_genel?select=*&aktif=eq.true', { headers: SB_HEADERS });
    if (r.ok) {
      const data = await r.json();
      if (Array.isArray(data) && data.length) {
        users = data.map(u => ({
          ...u,
          rol: u.rol === 'personel' ? 'depo' : u.rol,
          depoId: u.depo_id || u.depoId || null,
          otelId: u.otel_id || u.otelId || null
        }));
      }
    }
  } catch(e) {}
}

function findUserByEmail(email) {
  return users.find(u => u.eposta && u.eposta.toLowerCase() === String(email).toLowerCase()) || null;
}

// ============================================================
// PIN
// ============================================================
let pinValue = '';
// PIN kilitleme fonksiyonları (pinKilitliMi/pinBasarisizKaydet/pinBasariliTemizle)
// artık auth-guard.js'de tanımlı (paylaşılan) — burada tekrar tanımlanmıyor.

// PIN doğrulaması ve Auth oturumu üretimi artık TAMAMEN sunucu tarafında,
// tek bir Edge Function (pin-girisi) üzerinden yapılır: PIN hiçbir zaman
// Supabase Auth parolası olarak GÖNDERİLMEZ (bkz. docs/kurulum/ana-proje/
// pin-girisi/index.ts + docs/kurulum/2026-07-27-pin-hash-faz1-hazirlik.sql).
// Fonksiyon eşleşme yoksa VEYA sunucu taraflı rate-limit'e takılırsa
// AYIRT ETTİRMEDEN aynı genel hatayı döner (oracle oluşturmamak için).
async function pinGirisiDogrula(girisPin) {
  try {
    const r = await fetch(SB_URL + '/functions/v1/pin-girisi', {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: girisPin })
    });
    return await r.json();
  } catch (e) {
    return { ok: false, mesaj: 'Sunucuya bağlanılamadı' };
  }
}

async function pinInput(d) {
  const kalanSn=pinKilitliMi();
  if(kalanSn>0){document.getElementById('pin-error').textContent=`⏳ Çok fazla hatalı deneme — ${kalanSn} sn bekleyin`;return;}
  if (pinValue.length >= 6) return;
  pinValue += d;
  updateDots();
  document.getElementById('pin-error').textContent = '';
  if (pinValue.length === 6) setTimeout(() => checkPin(), 200);
}

function pinDelete() {
  pinValue = pinValue.slice(0,-1);
  updateDots();
  if (!pinValue) document.getElementById('pin-user-show').textContent = '';
}

function updateDots() {
  for (let i=0;i<6;i++) {
    document.getElementById('pd'+i).classList.toggle('filled', i < pinValue.length);
  }
}

document.addEventListener('keydown', e => {
  const loginScreen = document.getElementById('screen-login');
  if (!loginScreen || loginScreen.classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') { pinInput(e.key); }
  else if (e.key === 'Backspace') { pinDelete(); }
});

async function checkPin() {
  const girilenPin = pinValue;
  const sonuc = await pinGirisiDogrula(girilenPin);
  if (!sonuc || !sonuc.ok) {
    pinBasarisizKaydet();
    const kalanSn = pinKilitliMi();
    const errEl = document.getElementById('pin-error');
    errEl.textContent = kalanSn > 0
      ? `🔒 Çok fazla hatalı deneme — ${kalanSn} sn kilitlendi`
      : '❌ ' + (sonuc?.mesaj || 'Hatalı PIN');
    setTimeout(() => errEl.textContent = '', kalanSn > 0 ? 4000 : 2000);
    pinValue = '';
    updateDots();
    document.getElementById('pin-user-show').textContent = '';
    return;
  }
  pinBasariliTemizle();
  currentUser = sonuc.kullanici;
  oturumKaydet(currentUser, sonuc.access_token);
  sbHeaderlarYenile(sonuc.access_token);
  // Başarılı giriş kaydı (yönetici giris-kayitlari.html ekranı). Kullanıcı JWT'den
  // türetilir (giris_kaydi_ekle RPC). Hata girişi ASLA engellemez.
  try {
    await fetch(SB_URL + '/rest/v1/rpc/giris_kaydi_ekle', {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + sonuc.access_token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_giris_tipi: 'pin' })
    });
  } catch (e) { /* giriş kaydı hatası yutulur */ }
  await loadUsers();   // artık authenticated JWT var (anon'a kapalı — pentest [2])
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('returnTo');
  if (returnTo && /^[a-z0-9_-]+\.html(\?[^#]*)?(#.*)?$/i.test(returnTo)) {
    location.replace(returnTo);
    return;
  }
  await showPortal();
}

// ============================================================
// PORTAL
// ============================================================
async function showPortal() {
  const u = currentUser;
  document.getElementById('screen-login').classList.add('hidden');
  document.getElementById('screen-portal').classList.add('active');

  // Topbar / sidebar kullanıcı bilgisi
  document.getElementById('header-user-name').textContent = u.ad;
  document.getElementById('header-user-rol').textContent = ROL_AD[u.rol] || u.rol;
  document.getElementById('header-avatar').textContent = u.ad.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();

  // Hoşgeldin
  document.getElementById('welcome-text').textContent = 'Hoş geldin, ' + u.ad.split(' ')[0];
  document.getElementById('welcome-sub').textContent = (ROL_AD[u.rol]||u.rol) + ' • ' + (u.departman||'');

  // Tarih
  const now = new Date();
  document.getElementById('welcome-date').textContent =
    now.toLocaleDateString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  // Modülleri render et — gerçek yetki_matrisi'ne göre
  const yetkiHaritasi = await kullaniciYetkileriGetir();
  const izinliSeviyeler = ['goruntule','kayit','tam'];
  const gorunur = MODULLER.filter(m => m.moduller.some(kod => izinliSeviyeler.includes(yetkiHaritasi[kod])));
  GORUNUR_MODULLER = gorunur;
  renderSidebar(gorunur);
  renderModuleGrid(gorunur);
  sekmeCubuguRenderEt();

  loadKpiler();
}

function iconSvg(pathData) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${pathData}</svg>`;
}

function renderSidebar(list) {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = `<a class="sidebar-item active" href="javascript:void(0)" onclick="sekmeSec('home');sidebarKapat()">${iconSvg('<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>')}Ana Sayfa</a>` +
    list.map(m => {
      const aktif = m.durum === 'aktif';
      return aktif
        ? `<a class="sidebar-item" href="javascript:void(0)" onclick="sekmeAc({ad:'${m.ad}',url:'${m.url}'});sidebarKapat()">${iconSvg(m.svg)}${m.ad}</a>`
        : `<span class="sidebar-item disabled">${iconSvg(m.svg)}${m.ad}</span>`;
    }).join('');
}

function renderModuleGrid(list) {
  const grid = document.getElementById('modules-grid');
  grid.innerHTML = list.map(m => {
    const aktif = m.durum === 'aktif';
    const tag = aktif ? 'a' : 'div';
    const attrs = aktif ? ` href="javascript:void(0)" onclick="sekmeAc({ad:'${m.ad}',url:'${m.url}'})"` : '';
    return `
      <${tag} class="module-card ${aktif ? 'available' : 'coming-soon'}"${attrs}>
        <div class="module-icon">${iconSvg(m.svg)}</div>
        <div>
          <div class="module-name">${m.ad}</div>
          <div class="module-desc">${m.desc}</div>
          ${!aktif ? '<span class="module-soon-tag">Yakında</span>' : ''}
        </div>
      </${tag}>
    `;
  }).join('');
}

function sidebarAc() {
  document.getElementById('sidebar-overlay').classList.add('open');
  document.querySelector('.sidebar').classList.add('open');
}
function sidebarKapat() {
  document.getElementById('sidebar-overlay').classList.remove('open');
  document.querySelector('.sidebar').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') sidebarKapat(); });

// ============================================================
// SEKME SİSTEMİ (uygulama içi, iframe tabanlı) — bkz.
// docs/superpowers/specs/2026-07-29-sekme-sistemi-design.md
// ============================================================
let SEKMELER = [{ id: 'home', ad: 'Ana Sayfa', url: null, kapatilabilir: false }];
let AKTIF_SEKME = 'home';

function sekmeAc(modul) {
  const id = 'tab-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
  SEKMELER.push({ id, ad: modul.ad, url: modul.url, kapatilabilir: true });
  const frame = document.createElement('iframe');
  frame.className = 'tab-app-frame';
  frame.src = modul.url;
  frame.dataset.tabId = id;
  document.getElementById('tab-app-content').appendChild(frame);
  sekmeSec(id);
}

function sekmeSec(id) {
  AKTIF_SEKME = id;
  document.getElementById('tab-panel-home').classList.toggle('active', id === 'home');
  document.querySelectorAll('.tab-app-frame[data-tab-id]').forEach(el => {
    el.classList.toggle('active', el.dataset.tabId === id);
  });
  sekmeCubuguRenderEt();
}

function sekmeKapat(id, evt) {
  if (evt) evt.stopPropagation();
  const idx = SEKMELER.findIndex(s => s.id === id);
  if (idx < 0 || !SEKMELER[idx].kapatilabilir) return;
  SEKMELER.splice(idx, 1);
  const frame = document.querySelector('.tab-app-frame[data-tab-id="' + id + '"]');
  if (frame) frame.remove();
  if (AKTIF_SEKME === id) {
    sekmeSec(SEKMELER[Math.max(0, idx - 1)].id);
  } else {
    sekmeCubuguRenderEt();
  }
}

function sekmeCubuguRenderEt() {
  // Sadece kaydırılabilir sekme listesini yazar — "+" düğmesi statik HTML'de,
  // kaydırma alanının dışında sabit kalır (tasarım gereği).
  const el = document.getElementById('tab-bar-list');
  el.innerHTML = SEKMELER.map(s => `
    <button class="tab-app-btn${s.id === AKTIF_SEKME ? ' active' : ''}" onclick="sekmeSec('${s.id}')">
      <span class="tab-label">${escapeHtmlSekme(s.ad)}</span>
      ${s.kapatilabilir ? `<span class="tab-close" onclick="sekmeKapat('${s.id}',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px"><path d="M18 6 6 18M6 6l12 12"/></svg></span>` : ''}
    </button>
  `).join('');
}

function escapeHtmlSekme(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function sekmeEklePaneliAc() {
  const eski = document.getElementById('sekme-ekle-panel');
  if (eski) { sekmeEklePaneliKapat(); return; }
  // Modül sekmesi (iframe) aktifken içindeki tıklamalar üst document'e
  // yayılmaz, bu yüzden "dışına tıklayınca kapat" document click-listener
  // ile güvenilir çalışmaz. nav-drawer.js'deki #nd-overlay deseniyle aynı
  // yaklaşım: tüm viewport'u kaplayan görünmez bir overlay ekle — iframe'in
  // önünde render edildiği için tıklama iframe'e ulaşmadan overlay'e düşer.
  const overlay = document.createElement('div');
  overlay.id = 'sekme-ekle-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:499;background:transparent';
  overlay.onclick = sekmeEklePaneliKapat;
  const panel = document.createElement('div');
  panel.id = 'sekme-ekle-panel';
  panel.style.cssText = 'position:fixed;top:96px;right:20px;background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:8px;z-index:500;min-width:220px;max-height:70vh;overflow-y:auto';
  const aktifModuller = GORUNUR_MODULLER.filter(m => m.durum === 'aktif');
  panel.innerHTML = aktifModuller.length
    ? aktifModuller.map(m => `
        <div onclick="sekmeAc({ad:'${m.ad}',url:'${m.url}'});sekmeEklePaneliKapat();"
             style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--primary)"
             onmouseover="this.style.background='var(--gray-100)'" onmouseout="this.style.background='transparent'">
          ${iconSvg(m.svg)}${m.ad}
        </div>`).join('')
    : '<div style="padding:12px;font-size:12.5px;color:var(--gray-500)">Açılabilecek modül yok</div>';
  document.body.appendChild(overlay);
  document.body.appendChild(panel);
}

function sekmeEklePaneliKapat() {
  const panel = document.getElementById('sekme-ekle-panel');
  const overlay = document.getElementById('sekme-ekle-overlay');
  if (panel) panel.remove();
  if (overlay) overlay.remove();
}

window.addEventListener('beforeunload', e => {
  if (SEKMELER.some(s => s.kapatilabilir)) { e.preventDefault(); e.returnValue = ''; }
});

// ============================================================
// KPI ŞERİDİ — açık talep / bekleyen onay / SKT uyarısı / aktif kullanıcı.
// Bir tablo RLS ile engelliyse ilgili kart "—" gösterir (0 değil — "veri
// yok" ile "erişim engellendi" birbirine karışmasın diye).
// ============================================================
async function loadKpiler() {
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('kpi-kullanici', users.length);
  try {
    const [tR, mR, sR] = await Promise.all([
      fetch(SB_URL + '/rest/v1/satin_alma_talepleri?durum=eq.bekleyen&select=id', { headers: SB_HEADERS }),
      fetch(SB_URL + '/rest/v1/mal_kabuller?durum=eq.bekleyen&select=id', { headers: SB_HEADERS }),
      fetch(SB_URL + '/rest/v1/skt_kayitlari?durum=eq.aktif&select=skt_tarihi', { headers: SB_HEADERS }),
    ]);
    set('kpi-talep', tR.ok ? (await tR.json()).length : '—');
    set('kpi-onay', mR.ok ? (await mR.json()).length : '—');
    if (sR.ok) {
      const bugun = new Date(); bugun.setHours(0,0,0,0);
      const kritik = (await sR.json()).filter(r => {
        const gun = Math.round((new Date(r.skt_tarihi) - bugun) / 86400000);
        return gun >= 0 && gun < 14;
      }).length;
      set('kpi-skt', kritik);
    } else {
      set('kpi-skt', '—');
    }
  } catch (e) {
    set('kpi-talep', '—'); set('kpi-onay', '—'); set('kpi-skt', '—');
  }
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  currentUser = null;
  pinValue = '';
  updateDots();
  document.getElementById('pin-user-show').textContent = '';
  document.getElementById('pin-error').textContent = '';
  document.getElementById('screen-portal').classList.remove('active');
  document.getElementById('screen-login').classList.remove('hidden');
}

const TOAST_RENK={'✅':'var(--success)','❌':'var(--danger)','⚠️':'var(--warning)','🔷':'var(--primary-light)'};
function showToast(msg, dur=2500) {
  const t = document.getElementById('toast');
  const m = String(msg).match(/^(✅|❌|⚠️|🔷)\s*(.*)$/s);
  t.textContent = m ? m[2] : msg;
  t.style.borderLeft = m ? ('4px solid '+TOAST_RENK[m[1]]) : '';
  t.style.paddingLeft = m ? '16px' : '20px';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ============================================================
// INIT
// ============================================================
(async function init() {
  // GÜVENLİK (pentest [2]): kullanıcı dizini artık ANON'a kapalı. loadUsers()
  // giriş ÖNCESİ çağrılmaz — PIN doğrulaması zaten sunucuda (pin-girisi EF)
  // yapılıyor, istemcinin giriş öncesi kullanıcı listesine ihtiyacı yok.
  // Session kontrolü — paylaşılan auth-guard.js üzerinden
  const user = oturumGetir();
  if (user) {
    currentUser = user;
    document.getElementById('loading').classList.add('show');
    await loadUsers();               // oturum var → authenticated JWT ile okunur
    document.getElementById('loading').classList.remove('show');
    await showPortal();
  }
})();
</script>
