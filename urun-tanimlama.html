<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script src="auth-guard.js"></script>
<script src="supabase-config.js"></script>
<script src="nav-drawer.js"></script>
<script src="ortak.js"></script>
<link rel="stylesheet" href="theme.css">
<script>
let CU = requireLogin();
if (CU) requireRole(CU, ['yonetici','satinalma','depo','cost_control']);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Araz — Ürün Tanımlama</title>
<meta name="theme-color" content="#1a2744">
<style>
:root{--accent:#c9a24b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-100)}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--primary);color:white;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:56px;box-shadow:var(--shadow)}
.header h1{font-size:15px;font-weight:700;flex:1}.header .sub{font-size:11px;opacity:.7;display:block;margin-top:1px}
.hbtn{background:rgba(255,255,255,.15);border:none;color:white;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hbtn:active{background:rgba(255,255,255,.3)}
.sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.sc::-webkit-scrollbar{display:none}
.card{background:white;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:5px;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--gray-300);border-radius:var(--radius-sm);font-size:14px;background:white;outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--primary)}
.btn{padding:11px 18px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:active{transform:scale(.97)}.btn-primary{background:var(--primary);color:white}.btn-success{background:var(--success);color:white}.btn-danger{background:var(--danger);color:white}.btn-warning{background:var(--warning);color:white}.btn-gray{background:var(--gray-200);color:var(--gray-700)}.btn-info{background:var(--info);color:white}.btn-block{width:100%}.btn-sm{padding:7px 12px;font-size:12px;min-height:34px}
.brow{display:flex;gap:8px}.brow .btn{flex:1}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end}
.mo.open{display:flex}
.mbox{background:white;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:90vh;overflow-y:auto;animation:su .25s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mtitle{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.mclose{margin-left:auto;background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray-500)}
.es{text-align:center;padding:40px 20px;color:var(--gray-400)}.ei{font-size:48px;margin-bottom:12px}.et{font-size:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#ld{display:none;position:fixed;inset:0;background:rgba(26,39,68,.85);z-index:9998;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:white}
#ld.show{display:flex}
.sp{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <button class="hbtn" onclick="location.href='satin-alma.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div style="flex:1"><h1>Ürün Tanımlama</h1><span class="sub">Ürün aç, sistem fiyatı düzenle</span></div>
  </div>

  <div class="sc" id="tab-urunler">
    <div class="card">
      <div class="card-title">Ürünler
        <button class="btn btn-sm btn-primary" style="margin-left:auto" onclick="yeniUrunModalAc()">➕ Yeni Ürün</button>
      </div>
      <div class="field" style="margin-bottom:0">
        <input type="text" id="urun-ara" oninput="renderUrunler()" placeholder="Ürün ara...">
      </div>
    </div>
    <div id="urun-liste"></div>
  </div>
</div>

<!-- MODAL: Yeni Ürün -->
<div class="mo" id="mYeniUrun">
  <div class="mbox">
    <div class="mtitle">Yeni Ürün <button class="mclose" onclick="kModal('mYeniUrun')">✕</button></div>
    <div class="field"><label>Kod *</label><input type="text" id="nu-kod" placeholder="Ürün kodu"></div>
    <div class="field"><label>Ad *</label><input type="text" id="nu-ad" placeholder="Ürün adı"></div>
    <div class="field"><label>Birim</label>
      <select id="nu-birim">
        <option value="KG">KG</option>
        <option value="AD">AD</option>
        <option value="KOL">KOL</option>
        <option value="LT">LT</option>
        <option value="PKT">PKT</option>
        <option value="TRB">TRB</option>
        <option value="TNK">TNK</option>
        <option value="BOT">BOT</option>
      </select>
    </div>
    <div class="field"><label>Grup</label><input type="text" id="nu-grup" placeholder="Opsiyonel"></div>
    <div class="field" style="margin-bottom:0"><label>Sistem Fiyatı</label><input type="number" id="nu-fiyat" placeholder="Opsiyonel" min="0" step="0.01"></div>
    <div class="brow" style="margin-top:14px">
      <button class="btn btn-gray" onclick="kModal('mYeniUrun')">İptal</button>
      <button class="btn btn-success" style="flex:1" onclick="yeniUrunKaydet()">Ekle</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="ld"><div class="sp"></div><div style="font-size:13px">Yükleniyor...</div></div>

<script>
// SB_URL/SB_KEY/SB_HEADERS -> supabase-config.js
// sLD/hLD/toast/escapeHtml/kModal/aModal -> ortak.js

let URUNLER=[], YETKI_HARITASI={};
function yazabilir(){ return ['kayit','tam'].includes(YETKI_HARITASI['urun_yonetimi']); }

async function loadUrunler(){
  const r=await fetch(SB_URL+'/rest/v1/urunler?select=kod,ad,birim,grup,sistem_fiyat&order=ad',{headers:SB_HEADERS});
  URUNLER = r.ok ? await r.json() : [];
}

function renderUrunler(){
  const q=(document.getElementById('urun-ara').value||'').toLowerCase();
  const list=URUNLER.filter(u=>!q||(u.ad||'').toLowerCase().includes(q)||(u.kod||'').toLowerCase().includes(q)).slice(0,200);
  document.getElementById('urun-liste').innerHTML = list.map(u=>`
    <div style="background:#fff;border:1px solid #e4e7ec;border-radius:8px;padding:10px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
      <div style="flex:1"><b>${escapeHtml(u.ad)}</b> <span style="color:#8992a3;font-size:11px">${escapeHtml(u.kod)} · ${escapeHtml(u.birim||'')}</span>
        <div style="font-size:12px">Sistem fiyatı: <b>${u.sistem_fiyat!=null?parseFloat(u.sistem_fiyat).toFixed(2)+' ₺':'—'}</b></div></div>
      ${yazabilir()?`<button class="btn btn-sm btn-warning urun-fiyat-btn" data-kod="${escapeHtml(u.kod)}">Fiyat Düzenle</button>`:''}
    </div>`).join('') || '<div class="es"><div class="ei">📦</div><div class="et">Ürün yok</div></div>';
  // GÜVENLİK: kod inline onclick'e (JS string bağlamı) GÖMÜLMEZ — escapeHtml orada
  // koruma sağlamaz. data-kod ile taşınır, olay burada bağlanır.
  document.getElementById('urun-liste').querySelectorAll('.urun-fiyat-btn').forEach(b=>{
    b.onclick=()=>fiyatDuzenle(b.dataset.kod);
  });
}

async function urunEkle(kod, ad, birim, grup, fiyat){
  if(!yazabilir()){toast('⚠️ Yetkiniz yok');return;}
  if(!kod||!ad){toast('⚠️ Kod ve ad zorunlu');return;}
  const c=await fetch(SB_URL+'/rest/v1/urunler?kod=eq.'+encodeURIComponent(kod)+'&select=kod',{headers:SB_HEADERS});
  if(c.ok && (await c.json()).length){toast('⚠️ Bu kod zaten var');return;}
  const body={kod, ad, birim:birim||'KG', grup:grup||null};
  if(fiyat!==''&&fiyat!=null&&!isNaN(parseFloat(fiyat))){ body.sistem_fiyat=parseFloat(fiyat); body.sistem_fiyat_tarihi=new Date().toISOString(); body.sistem_fiyat_giren=CU.ad; }
  const r=await fetch(SB_URL+'/rest/v1/urunler',{method:'POST',headers:SB_HEADERS,body:JSON.stringify(body)});
  if(!r.ok){toast('❌ Eklenemedi');return;}
  await loadUrunler(); renderUrunler(); toast('✅ Ürün eklendi');
}

function yeniUrunModalAc(){
  if(!yazabilir()){toast('⚠️ Yetkiniz yok');return;}
  document.getElementById('nu-kod').value='';
  document.getElementById('nu-ad').value='';
  document.getElementById('nu-birim').value='KG';
  document.getElementById('nu-grup').value='';
  document.getElementById('nu-fiyat').value='';
  aModal('mYeniUrun');
}
async function yeniUrunKaydet(){
  const kod=document.getElementById('nu-kod').value.trim();
  const ad=document.getElementById('nu-ad').value.trim();
  const birim=document.getElementById('nu-birim').value;
  const grup=document.getElementById('nu-grup').value.trim();
  const fiyat=document.getElementById('nu-fiyat').value.trim();
  await urunEkle(kod, ad, birim, grup, fiyat);
  kModal('mYeniUrun');
}

async function fiyatGuncelle(kod, fiyat){
  if(!yazabilir()){toast('⚠️ Yetkiniz yok');return;}
  if(fiyat===''||isNaN(parseFloat(fiyat))){toast('⚠️ Geçerli fiyat girin');return;}
  const r=await fetch(SB_URL+'/rest/v1/urunler?kod=eq.'+encodeURIComponent(kod),{method:'PATCH',headers:SB_HEADERS,
    body:JSON.stringify({sistem_fiyat:parseFloat(fiyat), sistem_fiyat_tarihi:new Date().toISOString(), sistem_fiyat_giren:CU.ad})});
  if(!r.ok){toast('❌ Güncellenemedi');return;}
  await loadUrunler(); renderUrunler(); toast('✅ Fiyat güncellendi');
}
function fiyatDuzenle(kod){
  const u=URUNLER.find(x=>x.kod===kod); if(!u)return;
  const yeni=prompt('Yeni sistem fiyatı ('+u.ad+'):', u.sistem_fiyat!=null?u.sistem_fiyat:'');
  if(yeni!==null) fiyatGuncelle(kod, yeni.trim());
}

(async function(){ if(!CU)return; YETKI_HARITASI=await kullaniciYetkileriGetir(); sLD(); await loadUrunler(); hLD(); renderUrunler(); })();
</script>
</body>
</html>
